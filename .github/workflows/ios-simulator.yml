name: iOS simulator
on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-*']
    paths: ['ios/**', 'app/src/main/assets/**', '.github/workflows/ios-simulator.yml']
  pull_request:
    paths: ['ios/**', 'app/src/main/assets/**', '.github/workflows/ios-simulator.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: ios
        run: |
          xcodegen generate
          device=$(xcrun simctl list devices booted available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available -j | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          fi
          xcodebuild -project SehirNotlari.xcodeproj -scheme SehirNotlari -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -parallel-testing-enabled NO -resultBundlePath SmokeTests.xcresult CODE_SIGNING_ALLOWED=NO test
          test -f build/Build/Products/Debug-iphonesimulator/SehirNotlari.app/assets/index.html
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/SehirNotlari.app sehir-notlari-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sehir-notlari-ios-simulator
          path: ios/sehir-notlari-simulator.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke-test-results
          path: ios/SmokeTests.xcresult
  device-archive:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build and inspect iPhone release archive
        working-directory: ios
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | grep -E '/Xcode_26([.][0-9]+)*[.]app$' | sort -V | tail -1)
          test -n "$xcode"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version
          xcodegen generate
          archive="$RUNNER_TEMP/SehirNotlari.xcarchive"
          xcodebuild -project SehirNotlari.xcodeproj -scheme SehirNotlari -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/SehirNotlari.app"
          test -s "$app/assets/index.html"
          test -s "$app/Assets.car"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = com.sehirnotlari.ios
          test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$app/Info.plist")" = AppIcon
          xcrun lipo "$app/SehirNotlari" -verify_arch arm64
          if grep -aFq -- '--ui-test-import-fixture' "$app/SehirNotlari"; then
            echo 'The Release executable includes the Debug import fixture.' >&2
            exit 1
          fi
          ditto -c -k --keepParent "$archive" "$RUNNER_TEMP/sehir-notlari-unsigned-device.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sehir-notlari-unsigned-device-archive
          path: ${{ runner.temp }}/sehir-notlari-unsigned-device.zip
          if-no-files-found: error
